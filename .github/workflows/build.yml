name: Build Anji's Amp

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse "build/AnjisAmp_artefacts/Release/VST3/Anjis Amp.vst3" out/
          Copy-Item "build/AnjisAmp_artefacts/Release/Standalone/Anjis Amp.exe" out/
          Compress-Archive -Path out/* -DestinationPath AnjisAmp-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AnjisAmp-Windows
          path: AnjisAmp-Windows.zip
